<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Dandelion app icon: agent_loop (observe -> act -> persist) -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141D31"/>
      <stop offset="1" stop-color="#0A0F1B"/>
    </linearGradient>
    <linearGradient id="gA" x1="344.71" y1="150.29" x2="391.90" y2="232.04" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="gB" x1="303.20" y1="385.68" x2="208.80" y2="385.68" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="gC" x1="126.29" y1="303.20" x2="167.29" y2="150.29" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect x="12" y="12" width="488" height="488" rx="110" fill="url(#tile)"/>
  <rect x="15" y="15" width="482" height="482" rx="107" stroke="#94A3B8" stroke-opacity="0.16" stroke-width="3" fill="none"/>

  <!-- soft neon underglow -->
  <g filter="url(#glow)" opacity="0.35">
    <path d="M344.71 150.29 A138 138 0 0 1 391.90 232.04" stroke="#8B5CF6" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M303.20 385.68 A138 138 0 0 1 208.80 385.68" stroke="#38BDF8" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M126.29 303.20 A138 138 0 0 1 167.29 150.29" stroke="#60A5FA" stroke-width="16" stroke-linecap="round" fill="none"/>
    <circle cx="256" cy="118" r="42" stroke="#A78BFA" stroke-width="16" fill="none"/>
    <circle cx="375.51" cy="325" r="42" stroke="#38BDF8" stroke-width="16" fill="none"/>
    <circle cx="136.49" cy="325" r="42" stroke="#60A5FA" stroke-width="16" fill="none"/>
  </g>

  <!-- cycle arcs, hue flows continuously around the loop -->
  <g stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M344.71 150.29 A138 138 0 0 1 391.90 232.04" stroke="url(#gA)"/>
    <path d="M303.20 385.68 A138 138 0 0 1 208.80 385.68" stroke="url(#gB)"/>
    <path d="M126.29 303.20 A138 138 0 0 1 167.29 150.29" stroke="url(#gC)"/>
  </g>

  <!-- arrowheads -->
  <polygon points="396.41,257.64 374.81,234.79 408.29,228.89" fill="#38BDF8"/>
  <polygon points="184.37,376.79 215.29,369.96 203.67,401.90" fill="#60A5FA"/>
  <polygon points="187.21,133.58 176.69,164.59 154.83,138.55" fill="#A78BFA"/>

  <!-- nodes -->
  <g stroke-width="16" fill="none">
    <circle cx="256" cy="118" r="42" stroke="#A78BFA"/>
    <circle cx="375.51" cy="325" r="42" stroke="#38BDF8"/>
    <circle cx="136.49" cy="325" r="42" stroke="#60A5FA"/>
  </g>
</svg>
