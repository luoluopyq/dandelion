name: signed-desktop-updates
on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version, e.g. 0.2.0
        required: true
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --bundles nsis
            target: windows-x86_64
          - os: macos-14
            args: --target universal-apple-darwin --bundles app,dmg
            target: darwin-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Verify update signing configuration
        shell: bash
        env:
          OPERATIONS_URL: ${{ vars.DLN_OPERATIONS_URL }}
          UPDATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATE_PUBLIC_KEY: ${{ vars.DLN_UPDATE_PUBLIC_KEY }}
        run: |
          test -n "$OPERATIONS_URL" || { echo "Missing DLN_OPERATIONS_URL"; exit 1; }
          test -n "$UPDATE_KEY" || { echo "Missing TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
          test -n "$UPDATE_PUBLIC_KEY" || { echo "Missing DLN_UPDATE_PUBLIC_KEY"; exit 1; }
      - name: Prepare version and updater overlay
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/prepare-release.py "$RELEASE_VERSION" --updater --out apps/desktop/src-tauri/tauri.release.generated.json
      - run: npm ci
        working-directory: apps/desktop
      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then exit 0; fi
          CERTIFICATE_PATH="$RUNNER_TEMP/dandelion-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/dandelion-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          trap 'rm -f "$CERTIFICATE_PATH"' EXIT
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
      - name: Build signed update artifacts
        working-directory: apps/desktop
        env:
          DLN_OPERATIONS_URL: ${{ vars.DLN_OPERATIONS_URL }}
          DLN_UPDATE_PUBLIC_KEY: ${{ vars.DLN_UPDATE_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build -- ${{ matrix.args }} --config src-tauri/tauri.bundle.conf.json --config src-tauri/tauri.release.generated.json
      - uses: actions/upload-artifact@v4
        with:
          name: signed-update-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/**/bundle/nsis/*.exe
            target/**/bundle/nsis/*.sig
            target/**/bundle/macos/*.app.tar.gz
            target/**/bundle/macos/*.sig
            target/**/bundle/dmg/*.dmg
